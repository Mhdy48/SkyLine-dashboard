<!doctype html>
<html lang="en">
  <head>
    <!-- ================= META & LINKS ================= -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SkyLine Airline Dashboard" />
    <!-- Page Title -->
    <title>SkyLine | Dashboard</title>
    <!-- Page Icon -->
    <link
      rel="shortcut icon"
      href="assets/images/favicon.png"
      type="image/x-icon"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./src/output.css" />
    <!-- Chart Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="overflow-hidden">
    <!-- ================= MAIN LAYOUT ================= -->
    <div class="flex h-screen">
      <aside
        class="sidebar flex w-35 flex-col items-center justify-between gap-15 bg-[url('../assets/images/plain.png')] bg-cover bg-position-[33%] bg-no-repeat duration-50"
      >
        <!-- Logo -->
        <div
          class="mt-5 flex basis-[10%] items-center justify-start"
        >
          <img
            class="w-28"
            src="assets/images/SkyLine Logo.png"
            alt="SkyLine Logo"
          />
        </div>
      </aside>
    </div>
    <!-- ================= JAVASCRIPT ================= -->
    <script src="index.js"></script>
  </body>
</html>
