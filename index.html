<!doctype html>
<html lang="en">
  <head>
    <!-- ================= META & LINKS ================= -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SkyLine Airline Dashboard" />
    <!-- Page Title -->
    <title>SkyLine | Dashboard</title>
    <!-- Page Icon -->
    <link
      rel="shortcut icon"
      href="assets/images/favicon.png"
      type="image/x-icon"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./src/output.css" />
    <!-- Chart Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="overflow-hidden">
    <!-- ================= MAIN LAYOUT ================= -->
    <div class="flex h-screen max-[1300px]:flex-col">
      <aside
        class="sidebar flex w-35 flex-col items-center justify-between gap-15 bg-[url('../assets/images/plain.png')] bg-cover bg-position-[33%] bg-no-repeat duration-500 max-[1300px]:h-22 max-[1300px]:w-full max-[1300px]:flex-row max-[1300px]:gap-0 max-[1300px]:bg-sidebar max-[1300px]:bg-none max-[500px]:h-18 dark:bg-sidebar-dark dark:bg-none"
      >
        <!-- Logo -->
        <div
          class="mt-5 flex basis-[10%] items-center justify-start max-[1300px]:mt-0 max-[1300px]:h-full max-[1300px]:basis-[15%] max-[1300px]:p-1 max-[1000px]:basis-[20%] max-[500px]:h-17 max-[500px]:p-0"
        >
          <img
            class="w-28 max-[1300px]:h-20 max-[1300px]:w-20 max-[500px]:h-17 max-[500px]:w-17 max-[350px]:h-15 max-[350px]:w-15"
            src="assets/images/SkyLine Logo.png"
            alt="SkyLine Logo"
          />
        </div>
        <!-- Sidebar Navigation -->
        <nav
          class="flex basis-[90%] flex-col gap-5 max-[1300px]:flex-row-reverse max-[1300px]:justify-center max-[1300px]:gap-15 max-[650px]:gap-8 max-[500px]:gap-4 max-[350px]:gap-2"
        >
          <!-- Home Icon -->
          <a
            href="#"
            data-page="house"
            data-index="0"
            class="active-link flex items-center justify-center rounded-xl p-2 text-white no-underline transition-all duration-300 hover:bg-sidebar-hover"
          >
            <!-- SVG ICON -->
            <svg
              class="w-12 text-white max-[1300px]:w-10 max-[500px]:w-7 max-[350px]:w-6"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 672 672"
            >
              <path
                fill="currentColor"

              />
            </svg>
          </a>
          <!-- Plane Icon -->
          <a
            href="#"
            data-page="plane"
            data-index="1"
            class="flex items-center justify-center rounded-xl p-2 text-white no-underline transition-all duration-300 hover:bg-sidebar-hover"
          >
            <!-- SVG ICON -->
            <svg
              class="w-12 text-white max-[1300px]:w-10 max-[500px]:w-7 max-[350px]:w-6"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"
            >

              />
            </svg>
          </a>
          <!-- Ticket Icon -->
          <a
            href="#"
            data-page="ticket"
            data-index="2"
            class="flex items-center justify-center rounded-xl p-2 text-white no-underline transition-all duration-300 hover:bg-sidebar-hover"
          >
            <!-- SVG ICON -->
            <svg
              class="w-12 text-white max-[1300px]:w-10 max-[500px]:w-7 max-[350px]:w-6"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"
            >
              <path
                fill="currentColor"
                d="M608 128L32 128L32 272C58.5 272 80 293.5 80 320C80 346.5 58.5 368 32 368L32 512L608 512L608 368C581.5 368 560 346.5 560 320C560 293.5 581.5 272 608 272L608 128zM192 240L192 400L448 400L448 240L192 240zM144 192L496 192L496 448L144 448L144 192z"
              />
            </svg>
          </a>
          <!-- User Icon -->
          <a
            href="#"
            data-page="user"
            data-index="3"
            class="flex items-center justify-center rounded-xl p-2 text-white no-underline transition-all duration-300 hover:bg-sidebar-hover"
          >
            <!-- SVG ICON -->
            <svg
              class="w-12 text-white max-[1300px]:w-10 max-[500px]:w-7 max-[350px]:w-6"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"
            >
              <path
                fill="currentColor"
                d="M320 64C293.5 64 272 85.5 272 112L272 128L240 128L240 96L176 96L176 208C158.3 208 144 222.3 144 240L144 272C144 289.7 158.3 304 176 304C177.2 304 178.4 303.9 179.5 303.8C194 368 251.4 416 320 416C388.6 416 446 368 460.5 303.8C461.7 303.9 462.8 304 464 304C481.7 304 496 289.7 496 272L496 240C496 222.3 481.7 208 464 208L464 64L320 64zM240 216C240 202.7 250.7 192 264 192C277.3 192 288 202.7 288 216L288 240L240 240L240 216zM352 216C352 202.7 362.7 192 376 192C389.3 192 400 202.7 400 216L400 240L352 240L352 216zM320 368C284.7 368 256 339.3 256 304L384 304C384 339.3 355.3 368 320 368zM96 560L544 560C544 489.3 486.7 432 416 432L416 528L320 432L224 528L224 432C153.3 432 96 489.3 96 560z"
              />
            </svg>
          </a>
        </nav>
        <button
          id="themeToggle"
          type="button"
          class="m-4 flex aspect-square cursor-pointer items-center justify-center rounded-full bg-surface-soft p-3 transition-all duration-500 hover:bg-surface max-[500px]:m-3 max-[500px]:p-2.5 max-[350px]:p-0.75 dark:bg-border-dark-soft dark:hover:bg-border-dark-soft"
        >
          <i
            id="themeIcon"
            class="max-[500px]:text-md fa-solid fa-moon text-content-primary dark:text-yellow-400"
          ></i>
        </button>
      </aside>
      <!-- ================= MAIN CONTENT ================= -->
      <main class="relative flex-1 overflow-hidden">
        <!-- ================= DASHBOARD PAGE ================= -->
        <section
          class="page current absolute h-full w-full bg-overlay px-8 py-5 text-black transition-all duration-500 max-[1300px]:overflow-y-auto max-[400px]:px-5 dark:bg-page-dark dark:text-white"
        >
          <!-- ================= HEADER ================= -->
          <header
            class="flex flex-row border-b border-border pb-5 duration-500 max-[650px]:border-0 max-[400px]:flex-col max-[400px]:border-b dark:border-border-dark"
          >
            <!-- Dashboard Title -->
            <div class="flex basis-[70%] items-center max-[400px]:order-2">
              <div class="group">
                <h1
                  class="text-2xl font-semibold tracking-wide text-content-primary duration-500 max-[400px]:mt-5 dark:text-white"
                >
                  Dashboard
                </h1>
                <!-- Hover Underline -->
                <div
                  class="mt-1 h-px w-0 bg-content-primary transition-all duration-500 group-hover:w-full dark:bg-surface"
                ></div>
              </div>
            </div>
          </header>
        </section>

        <section
          class="page right absolute inset-0 flex items-center justify-center bg-page-plane text-[50px] text-white transition-transform duration-400 ease-in-out"
        >
          <h1>plane</h1>
        </section>

        <section
          class="page right absolute inset-0 flex items-center justify-center bg-page-ticket text-[50px] text-white transition-transform duration-400 ease-in-out"
        >
          <h1>ticket</h1>
        </section>
        <section
          class="page right absolute inset-0 flex items-center justify-center bg-page-user text-[50px] text-white transition-transform duration-400 ease-in-out"
        >
          <h1>user</h1>
        </section>
      </main>
    </div>
    <!-- ================= JAVASCRIPT ================= -->
    <script src="index.js"></script>
  </body>
</html>
